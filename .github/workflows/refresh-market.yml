name: Refresh marketplace distribution

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "list.json"
      - "adapters.json"
      - "schema/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/refresh-market.yml"

permissions:
  contents: read

concurrency:
  group: refresh-marketplace
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: .cache/contracts-v1
          key: contracts-v1-${{ runner.os }}-${{ hashFiles('scripts/ContractInspector/**', 'scripts/inspect-asset.mjs') }}-${{ github.run_id }}
          restore-keys: |
            contracts-v1-${{ runner.os }}-${{ hashFiles('scripts/ContractInspector/**', 'scripts/inspect-asset.mjs') }}-
      - name: Restore previous distribution timestamps
        run: |
          mkdir -p dist
          if git fetch origin automation/refresh-marketplace; then
            for file in marketplace.v1.json adapters.v1.json; do
              git show "FETCH_HEAD:dist/$file" > "dist/$file" || true
            done
          fi
      - name: Download and statically inspect releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-market.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-dist
          path: dist/
          if-no-files-found: error
  refresh:
    needs: inspect
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download inspected distribution
        uses: actions/download-artifact@v4
        with:
          name: marketplace-dist
          path: ${{ runner.temp }}/marketplace-dist

      - name: Refresh distribution branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="automation/refresh-marketplace"
          PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # dist/ is generated, not tracked on main, so it may not exist yet.
          mkdir -p dist

          remote_sha=""
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            remote_sha="$(git rev-parse "origin/$BRANCH")"
            git show "origin/$BRANCH:dist/marketplace.v1.json" > "$RUNNER_TEMP/previous-marketplace.json" || true
            git show "origin/$BRANCH:dist/marketplace.v1.json.sha256" > "$RUNNER_TEMP/previous-marketplace.sha256" || true
            git show "origin/$BRANCH:dist/adapters.v1.json" > "$RUNNER_TEMP/previous-adapters.json" || true
            git show "origin/$BRANCH:dist/adapters.v1.json.sha256" > "$RUNNER_TEMP/previous-adapters.sha256" || true
            if [ -s "$RUNNER_TEMP/previous-marketplace.json" ]; then
              cp "$RUNNER_TEMP/previous-marketplace.json" dist/marketplace.v1.json
            fi
            if [ -s "$RUNNER_TEMP/previous-marketplace.sha256" ]; then
              cp "$RUNNER_TEMP/previous-marketplace.sha256" dist/marketplace.v1.json.sha256
            fi
            if [ -s "$RUNNER_TEMP/previous-adapters.json" ]; then
              cp "$RUNNER_TEMP/previous-adapters.json" dist/adapters.v1.json
            fi
            if [ -s "$RUNNER_TEMP/previous-adapters.sha256" ]; then
              cp "$RUNNER_TEMP/previous-adapters.sha256" dist/adapters.v1.json.sha256
            fi
          fi


          if [ -n "$remote_sha" ]; then
            if cmp -s "$RUNNER_TEMP/marketplace-dist/marketplace.v1.json" "$RUNNER_TEMP/previous-marketplace.json" \
               && cmp -s "$RUNNER_TEMP/marketplace-dist/marketplace.v1.json.sha256" "$RUNNER_TEMP/previous-marketplace.sha256" \
               && cmp -s "$RUNNER_TEMP/marketplace-dist/adapters.v1.json" "$RUNNER_TEMP/previous-adapters.json" \
               && cmp -s "$RUNNER_TEMP/marketplace-dist/adapters.v1.json.sha256" "$RUNNER_TEMP/previous-adapters.sha256"; then
              echo "Marketplace distribution is already current."
              exit 0
            fi
          fi

          git switch --force-create "$BRANCH" "$GITHUB_SHA"
          cp "$RUNNER_TEMP/marketplace-dist/marketplace.v1.json" dist/marketplace.v1.json
          cp "$RUNNER_TEMP/marketplace-dist/marketplace.v1.json.sha256" dist/marketplace.v1.json.sha256
          cp "$RUNNER_TEMP/marketplace-dist/adapters.v1.json" dist/adapters.v1.json
          cp "$RUNNER_TEMP/marketplace-dist/adapters.v1.json.sha256" dist/adapters.v1.json.sha256

          git add -f dist/marketplace.v1.json dist/marketplace.v1.json.sha256 dist/adapters.v1.json dist/adapters.v1.json.sha256
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh marketplace distribution"
          fi
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$BRANCH:$remote_sha" "$PUSH_URL" "HEAD:refs/heads/$BRANCH"
          else
            git push "$PUSH_URL" "HEAD:refs/heads/$BRANCH"
          fi
